<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pasture</title>
<style>
:root{color-scheme:light dark;font:13px system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:#19231c;color:#f7f7ef}#root{height:100vh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:8px;padding:8px 10px;flex-wrap:wrap;background:#202c23}h1{font-size:15px;margin:0;margin-right:auto}button{font:inherit;color:inherit;background:#3b5040;border:1px solid #68796b;border-radius:7px;padding:5px 9px;cursor:pointer}button:hover{background:#526a57}button:focus-visible{outline:2px solid #fff}#status{padding:6px 10px;background:#26392c;min-height:30px}#field{position:relative;flex:1;min-height:180px;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#tip,#detail{position:absolute;background:#17241cf0;border:1px solid #718477;border-radius:9px;padding:10px;box-shadow:0 3px 15px #0006;max-width:min(340px,90%)}#tip{pointer-events:none;top:8px;left:8px}#detail{bottom:12px;left:12px}#detail strong,#detail span{display:block;margin-bottom:5px}#detail button{margin:4px 5px 0 0}footer{padding:6px 10px;background:#202c23;color:#c6d3c8;font-size:12px}[hidden]{display:none!important}
</style></head><body><div id="root"><header><h1>🐄 Pasture</h1><button id="refresh">Refresh</button><button id="tour" aria-pressed="false">Tour</button></header><div id="status" role="status">Connecting to OpenChamber…</div><div id="field"><canvas id="scene" aria-label="A pasture with pull requests as cows"></canvas><div id="tip" hidden></div><div id="detail" hidden><strong id="title"></strong><span id="meta"></span><span id="explanation"></span><button id="moo">Moo</button><button id="open">Open PR</button><button id="down">Put it down</button></div></div><footer>Hover a cow for its PR · click to lift · double-click to open · drag to look around</footer></div><script src="main.js"></script></body></html>
