<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pasture harness</title>
    <!-- Dev only: bun --cwd packages/app dev, then open /dev/pasture-harness.html. Fake cows, manual hand-of-god transfers. -->
    <style>
      html, body { margin: 0; height: 100%; background: #111; font: 13px system-ui, sans-serif; }
      #host { position: absolute; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #bar { position: absolute; left: 12px; top: 12px; z-index: 2; display: flex; gap: 8px; align-items: center; background: rgba(255,255,255,.85); padding: 8px 10px; border-radius: 8px; }
      #log { position: absolute; left: 12px; bottom: 12px; z-index: 2; background: rgba(255,255,255,.85); padding: 6px 10px; border-radius: 8px; max-width: 60%; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="host"><canvas id="c"></canvas></div>
    <div id="bar">
      <button id="move">Move one</button>
      <button id="arrive">Arrive</button>
      <button id="depart">Depart</button>
      <button id="select">Select one</button>
      <span id="status"></span>
    </div>
    <div id="log"></div>
    <script type="module" src="/src/pasture/harness.ts"></script>
  </body>
</html>
